<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arrays</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar bg-body-tertiary sticky-top">
  <div class="container-fluid">
    <div class="d-flex align-items-center gap-2">
    <a href="index.html" class="btn btn-success mt-auto">Dashboard</a>
    <button class="btn btn-outline-primary" id="addsolbox" type="submit">Add Solution</button>
    <div id="solbox"></div>
    </div>
    <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
  </div>
</nav>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-md justify-content-center">
    <a class="navbar-brand " href="#"><h1>Conquering Arrays</h1> </a>
  </div>
</nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script>
let addsol = document.getElementById("addsolbox");

addsol.addEventListener("click", (e) => {
    e.preventDefault(); 
    
    let container = document.getElementById("solbox");
    
   
    container.innerHTML = `
        <form class="row g-3 needs-validation mt-3" id="solutionForm" novalidate>
            <div class="col-md-4">
                <label for="validationCustom01" class="form-label">Question Link</label>
                <input type="text" class="form-control" id="validationCustom01" required>
                <div class="invalid-feedback">
                    Please provide the link.
                </div>
            </div>
            
            <div class="col-12">
                <label for="codeTextarea" class="form-label">Your Code</label>
                <textarea class="form-control font-monospace" placeholder="Write/Paste your code here" id="codeTextarea" style="height: 200px; background-color: #f8f9fa;" required></textarea>
                <div class="invalid-feedback">
                    Please provide your code.
                </div>
            </div>

            <div class="col-12">
                <button class="btn btn-success" type="submit">Submit</button>
                <button class="btn btn-danger" id="cancelbtn" type="button">Cancel</button>
            </div>
        </form>
    `;

    const form = document.getElementById('solutionForm');
    form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        } 
        else{
            console.log(document.getElementById('codeTextarea'));
            alert("Code Successfully Added");
            container.innerHTML="";
        }
        form.classList.add('was-validated');
    }, false);
    
    const cancelbtn=document.getElementById('cancelbtn');
 cancelbtn.addEventListener('click',()=>{
    container.innerHTML="";
 });
});
 
  </script>
</body>
</html>
